<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Checklists</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0f1216; color: #e8ebef;
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #8d97a5; font-size: 14px; margin: 0 0 20px; }
  a.card { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #171b21; border: 1px solid #2a313b; border-radius: 12px; padding: 18px;
    margin-bottom: 10px; color: inherit; text-decoration: none; min-height: 72px; }
  a.card:active { border-color: #4fb3ff; background: #10263a; }
  .name { font-size: 19px; font-weight: 700; }
  .desc { color: #8d97a5; font-size: 14px; margin-top: 2px; }
  .arrow { color: #4fb3ff; font-size: 26px; }
  footer { color: #8d97a5; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Sim Checklists</h1>
  <p class="sub">MSFS 2024. For flight simulation only.</p>
  <div id="list"></div>
  <footer>Each checklist remembers its own ticks on this device. Use Reset all before each flight.</footer>
</main>
<script>
// To add a checklist: upload its .html file to the repo and add one line here.
const CHECKLISTS = [
  { file: "c172.html", name: "Cessna 172S G1000", desc: "Normal procedures, Before Start to Shutdown" },
  { file: "sf50.html", name: "Cirrus SF50 Vision Jet", desc: "Normal procedures, Cockpit Setup to Shutdown" }
];
document.getElementById("list").innerHTML = CHECKLISTS.map(c =>
  '<a class="card" href="' + c.file + '"><div><div class="name">' + c.name +
  '</div><div class="desc">' + c.desc + '</div></div><span class="arrow">&rsaquo;</span></a>').join("");
</script>
</body>
</html>
